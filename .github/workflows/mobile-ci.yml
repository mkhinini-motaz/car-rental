name: Mobile CI

on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:

jobs:
  check:
    defaults:
      run:
        working-directory: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: mobile/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test --ci
      - run: npx tsc --noEmit
      # Catches imports that don't resolve on one platform.
      - run: npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output /tmp/ios.jsbundle
      - run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/android.jsbundle
