# Checks, when run by hand: types, the tests (test/: support code, and every page rendered
# against a fake API), translation keys, and that the production build compiles. Actions are pinned
# to commit SHAs like build.yml's; Dependabot proposes updates.
name: Web CI

on:
  push:
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    defaults:
      run:
        working-directory: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:i18n
      - run: npm run build
